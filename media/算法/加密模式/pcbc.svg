<svg xmlns="http://www.w3.org/2000/svg" width="620" height="720" viewBox="0 0 620 720" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="bold">PCBC 加密与解密</text>

  <!-- ================= 加密部分 ================= -->
  <text x="40" y="48" font-size="13" fill="#555">加密</text>

  <!-- 明文行 -->
  <rect x="60" y="60" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="115" y="85" text-anchor="middle">明文 P1</text>
  <rect x="240" y="60" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="295" y="85" text-anchor="middle">明文 P2</text>
  <rect x="420" y="60" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="475" y="85" text-anchor="middle">明文 P3</text>

  <!-- 明文 -> 主异或 -->
  <line x1="115" y1="100" x2="115" y2="142" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="295" y1="100" x2="295" y2="142" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="475" y1="100" x2="475" y2="142" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 主异或节点 -->
  <circle cx="115" cy="160" r="16" fill="#fff" stroke="#333"/>
  <text x="115" y="166" text-anchor="middle" font-size="16">+</text>
  <circle cx="295" cy="160" r="16" fill="#fff" stroke="#333"/>
  <text x="295" y="166" text-anchor="middle" font-size="16">+</text>
  <circle cx="475" cy="160" r="16" fill="#fff" stroke="#333"/>
  <text x="475" y="166" text-anchor="middle" font-size="16">+</text>

  <!-- IV -> 第一个主异或（紫色框） -->
  <rect x="10" y="142" width="50" height="36" rx="6" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="35" y="165" text-anchor="middle" font-size="12">IV</text>
  <line x1="60" y1="160" x2="95" y2="160" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 主异或 -> enc -> 密文 -->
  <line x1="115" y1="178" x2="115" y2="218" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="295" y1="178" x2="295" y2="218" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="475" y1="178" x2="475" y2="218" stroke="#333" marker-end="url(#arrow)"/>

  <text x="123" y="200" font-size="12" fill="#c62828">enc</text>
  <text x="303" y="200" font-size="12" fill="#c62828">enc</text>
  <text x="483" y="200" font-size="12" fill="#c62828">enc</text>

  <!-- 密文行 -->
  <rect x="60" y="220" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="115" y="245" text-anchor="middle">密文 C1</text>
  <rect x="240" y="220" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="295" y="245" text-anchor="middle">密文 C2</text>
  <rect x="420" y="220" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="475" y="245" text-anchor="middle">密文 C3</text>

  <!-- 反馈异或：P1 和 C1 先异或，输出进入第二段主异或 -->
  <circle cx="180" cy="160" r="14" fill="#fff" stroke="#333"/>
  <text x="180" y="165" text-anchor="middle" font-size="14">+</text>
  <path d="M170,80 L180,80 L180,144" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M170,240 L180,240 L180,176" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="196" y1="160" x2="277" y2="160" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 反馈异或：P2 和 C2 先异或，输出进入第三段主异或 -->
  <circle cx="360" cy="160" r="14" fill="#fff" stroke="#333"/>
  <text x="360" y="165" text-anchor="middle" font-size="14">+</text>
  <path d="M350,80 L360,80 L360,144" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M350,240 L360,240 L360,176" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="376" y1="160" x2="457" y2="160" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="20" y1="310" x2="600" y2="310" stroke="#ccc" stroke-dasharray="6,4"/>

  <!-- ================= 解密部分 ================= -->
  <text x="40" y="340" font-size="13" fill="#555">解密</text>

  <!-- 密文行 -->
  <rect x="60" y="360" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="115" y="385" text-anchor="middle">密文 C1</text>
  <rect x="240" y="360" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="295" y="385" text-anchor="middle">密文 C2</text>
  <rect x="420" y="360" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="475" y="385" text-anchor="middle">密文 C3</text>

  <!-- 密文 -> dec -> 主异或 -->
  <line x1="115" y1="400" x2="115" y2="442" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="295" y1="400" x2="295" y2="442" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="475" y1="400" x2="475" y2="442" stroke="#333" marker-end="url(#arrow)"/>

  <text x="123" y="422" font-size="12" fill="#c62828">dec</text>
  <text x="303" y="422" font-size="12" fill="#c62828">dec</text>
  <text x="483" y="422" font-size="12" fill="#c62828">dec</text>

  <!-- 主异或节点 -->
  <circle cx="115" cy="460" r="16" fill="#fff" stroke="#333"/>
  <text x="115" y="466" text-anchor="middle" font-size="16">+</text>
  <circle cx="295" cy="460" r="16" fill="#fff" stroke="#333"/>
  <text x="295" y="466" text-anchor="middle" font-size="16">+</text>
  <circle cx="475" cy="460" r="16" fill="#fff" stroke="#333"/>
  <text x="475" y="466" text-anchor="middle" font-size="16">+</text>

  <!-- IV -> 第一个主异或（紫色框） -->
  <rect x="10" y="442" width="50" height="36" rx="6" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="35" y="465" text-anchor="middle" font-size="12">IV</text>
  <line x1="60" y1="460" x2="95" y2="460" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 主异或 -> 明文 -->
  <line x1="115" y1="478" x2="115" y2="518" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="295" y1="478" x2="295" y2="518" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="475" y1="478" x2="475" y2="518" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 明文行 -->
  <rect x="60" y="520" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="115" y="545" text-anchor="middle">明文 P1</text>
  <rect x="240" y="520" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="295" y="545" text-anchor="middle">明文 P2</text>
  <rect x="420" y="520" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="475" y="545" text-anchor="middle">明文 P3</text>

  <!-- 反馈异或：P1 和 C1 先异或，输出进入第二段主异或 -->
  <circle cx="180" cy="460" r="14" fill="#fff" stroke="#333"/>
  <text x="180" y="465" text-anchor="middle" font-size="14">+</text>
  <path d="M170,380 L180,380 L180,444" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M170,540 L180,540 L180,476" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="196" y1="460" x2="277" y2="460" stroke="#333" marker-end="url(#arrow)"/>

  <circle cx="360" cy="460" r="14" fill="#fff" stroke="#333"/>
  <text x="360" y="465" text-anchor="middle" font-size="14">+</text>
  <path d="M350,380 L360,380 L360,444" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M350,540 L360,540 L360,476" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="376" y1="460" x2="457" y2="460" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <text x="40" y="620" font-size="12" fill="#333">所有连线均为黑色，箭头表示方向</text>
</svg>