<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold">CBC 加密与解密</text>

  <!-- ================= 加密部分 ================= -->
  <text x="40" y="48" font-size="13" fill="#555">加密</text>

  <!-- 明文行 -->
  <rect x="40" y="60" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="95" y="85" text-anchor="middle">明文 P1</text>
  <rect x="180" y="60" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="235" y="85" text-anchor="middle">明文 P2</text>
  <rect x="320" y="60" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="375" y="85" text-anchor="middle">明文 P3</text>

  <!-- 明文到异或 -->
  <line x1="95" y1="100" x2="95" y2="144" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="235" y1="100" x2="235" y2="144" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="375" y1="100" x2="375" y2="144" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或节点 -->
  <circle cx="95" cy="160" r="16" fill="#fff" stroke="#333"/>
  <text x="95" y="166" text-anchor="middle" font-size="16">+</text>
  <circle cx="235" cy="160" r="16" fill="#fff" stroke="#333"/>
  <text x="235" y="166" text-anchor="middle" font-size="16">+</text>
  <circle cx="375" cy="160" r="16" fill="#fff" stroke="#333"/>
  <text x="375" y="166" text-anchor="middle" font-size="16">+</text>

  <!-- IV 到第一个异或 -->
  <text x="20" y="165" text-anchor="end" font-size="13">IV</text>
  <line x1="24" y1="160" x2="79" y2="160" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或到加密 -->
  <line x1="95" y1="176" x2="95" y2="216" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="235" y1="176" x2="235" y2="216" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="375" y1="176" x2="375" y2="216" stroke="#333" marker-end="url(#arrow)"/>

  <text x="103" y="196" font-size="12" fill="#c62828">enc</text>
  <text x="243" y="196" font-size="12" fill="#c62828">enc</text>
  <text x="383" y="196" font-size="12" fill="#c62828">enc</text>

  <!-- 密文行 -->
  <rect x="40" y="220" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="95" y="245" text-anchor="middle">密文 C1</text>
  <rect x="180" y="220" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="235" y="245" text-anchor="middle">密文 C2</text>
  <rect x="320" y="220" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="375" y="245" text-anchor="middle">密文 C3</text>

  <!-- 反馈线：C1 -> 第二个异或；C2 -> 第三个异或 -->
  <path d="M150,240 L165,240 L165,160 L219,160" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,240 L305,240 L305,160 L359,160" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="20" y1="300" x2="540" y2="300" stroke="#ccc" stroke-dasharray="6,4"/>

  <!-- ================= 解密部分 ================= -->
  <text x="40" y="330" font-size="13" fill="#555">解密</text>

  <!-- 密文行 -->
  <rect x="40" y="340" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="95" y="365" text-anchor="middle">密文 C1</text>
  <rect x="180" y="340" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="235" y="365" text-anchor="middle">密文 C2</text>
  <rect x="320" y="340" width="110" height="40" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="375" y="365" text-anchor="middle">密文 C3</text>

  <!-- 密文到解密 -->
  <line x1="95" y1="380" x2="95" y2="424" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="235" y1="380" x2="235" y2="424" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="375" y1="380" x2="375" y2="424" stroke="#333" marker-end="url(#arrow)"/>

  <text x="103" y="400" font-size="12" fill="#c62828">dec</text>
  <text x="243" y="400" font-size="12" fill="#c62828">dec</text>
  <text x="383" y="400" font-size="12" fill="#c62828">dec</text>

  <!-- 解密后异或 -->
  <circle cx="95" cy="440" r="16" fill="#fff" stroke="#333"/>
  <text x="95" y="446" text-anchor="middle" font-size="16">+</text>
  <circle cx="235" cy="440" r="16" fill="#fff" stroke="#333"/>
  <text x="235" y="446" text-anchor="middle" font-size="16">+</text>
  <circle cx="375" cy="440" r="16" fill="#fff" stroke="#333"/>
  <text x="375" y="446" text-anchor="middle" font-size="16">+</text>


  <!-- IV 到第一个异或（解密） -->
  <text x="20" y="445" text-anchor="end" font-size="13">IV</text>
  <line x1="24" y1="440" x2="79" y2="440" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或到明文 -->
  <line x1="95" y1="456" x2="95" y2="496" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="235" y1="456" x2="235" y2="496" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="375" y1="456" x2="375" y2="496" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 明文行 -->
  <rect x="40" y="500" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="95" y="525" text-anchor="middle">明文 P1</text>
  <rect x="180" y="500" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="235" y="525" text-anchor="middle">明文 P2</text>
  <rect x="320" y="500" width="110" height="40" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="375" y="525" text-anchor="middle">明文 P3</text>

  <!-- 解密反馈线：C1 -> 第二个异或；C2 -> 第三个异或 -->
  <path d="M150,360 L165,360 L165,440 L219,440" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,360 L305,360 L305,440 L359,440" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>