<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold">GCM 加密与解密</text>

  <!-- ================= 加密部分 ================= -->
  <text x="30" y="50" font-size="13" fill="#555">加密</text>

  <!-- Nonce -> IV+1 -> IV+2 -> IV+3 -->
  <rect x="40" y="70" width="90" height="36" rx="6" fill="#ede7f6" stroke="#333"/>
  <text x="85" y="93" text-anchor="middle" font-size="12">Nonce</text>

  <line x1="130" y1="88" x2="186" y2="88" stroke="#333" marker-end="url(#arrow)"/>
  <text x="132" y="82" text-anchor="middle"font-size="9" fill="#c62828">‖0³¹‖1</text>

  <rect x="190" y="70" width="90" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="235" y="93" text-anchor="middle" font-size="12">IV+1</text>

  <line x1="280" y1="88" x2="336" y2="88" stroke="#333" marker-end="url(#arrow)"/>
  <text x="300" y="82" font-size="11" fill="#c62828">+1</text>

  <rect x="340" y="70" width="90" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="385" y="93" text-anchor="middle" font-size="12">IV+2</text>

  <line x1="430" y1="88" x2="486" y2="88" stroke="#333" marker-end="url(#arrow)"/>
  <text x="450" y="82" font-size="11" fill="#c62828">+1</text>

  <rect x="490" y="70" width="90" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="535" y="93" text-anchor="middle" font-size="12">IV+3</text>

  <!-- IV+1/IV+2/IV+3：下左下右，第一个“下”加长，enc 下挪 -->
  <polyline points="235,106 235,136 175,136 175,210 221,210" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="243" y="132" font-size="11" fill="#c62828">enc</text>

  <polyline points="385,106 385,136 325,136 325,210 371,210" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="393" y="132" font-size="11" fill="#c62828">enc</text>

  <polyline points="535,106 535,136 475,136 475,210 521,210" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="543" y="132" font-size="11" fill="#c62828">enc</text>

  <!-- 明文行 -->
  <rect x="190" y="150" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="235" y="173" text-anchor="middle">明文 P1</text>
  <rect x="340" y="150" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="385" y="173" text-anchor="middle">明文 P2</text>
  <rect x="490" y="150" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="535" y="173" text-anchor="middle">明文 P3</text>

  <line x1="235" y1="186" x2="235" y2="196" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="385" y1="186" x2="385" y2="196" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="535" y1="186" x2="535" y2="196" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或 -->
  <circle cx="235" cy="210" r="14" fill="#fff" stroke="#333"/>
  <text x="235" y="215" text-anchor="middle" font-size="14">+</text>
  <circle cx="385" cy="210" r="14" fill="#fff" stroke="#333"/>
  <text x="385" y="215" text-anchor="middle" font-size="14">+</text>
  <circle cx="535" cy="210" r="14" fill="#fff" stroke="#333"/>
  <text x="535" y="215" text-anchor="middle" font-size="14">+</text>

  <line x1="235" y1="224" x2="235" y2="246" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="385" y1="224" x2="385" y2="246" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="535" y1="224" x2="535" y2="246" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 密文行 -->
  <rect x="190" y="250" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="235" y="273" text-anchor="middle">密文 C1</text>
  <rect x="340" y="250" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="385" y="273" text-anchor="middle">密文 C2</text>
  <rect x="490" y="250" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="535" y="273" text-anchor="middle">密文 C3</text>

  <!-- 认证分支：AAD + 密文 -> GHASH -> Tag -->
  <rect x="660" y="70" width="80" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="700" y="93" text-anchor="middle" font-size="12">AAD</text>
  <line x1="700" y1="106" x2="700" y2="136" stroke="#333" marker-end="url(#arrow)"/>
  <text x="708" y="128" font-size="11" fill="#c62828">auth</text>

  <rect x="660" y="140" width="80" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="700" y="163" text-anchor="middle" font-size="12">GHASH</text>

  <path d="M580,268 L620,268 L620,158 L656,158" fill="none" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="700" y1="176" x2="700" y2="246" stroke="#333" marker-end="url(#arrow)"/>
  <rect x="650" y="250" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="700" y="273" text-anchor="middle" font-size="12">认证标签 Tag</text>

  <line x1="20" y1="330" x2="940" y2="330" stroke="#ccc" stroke-dasharray="6,4"/>

  <!-- ================= 解密部分 ================= -->
  <text x="30" y="360" font-size="13" fill="#555">解密</text>

  <!-- Nonce -> IV+1 -> IV+2 -> IV+3 -->
  <rect x="40" y="380" width="90" height="36" rx="6" fill="#ede7f6" stroke="#333"/>
  <text x="85" y="403" text-anchor="middle" font-size="12">Nonce</text>
  <line x1="130" y1="398" x2="186" y2="398" stroke="#333" marker-end="url(#arrow)"/>
  <text x="132" y="392" font-size="9" fill="#c62828">‖0³¹‖1</text>
  <rect x="190" y="380" width="90" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="235" y="403" text-anchor="middle" font-size="12">IV+1</text>
  <line x1="280" y1="398" x2="336" y2="398" stroke="#333" marker-end="url(#arrow)"/>
  <text x="300" y="392" font-size="11" fill="#c62828">+1</text>
  <rect x="340" y="380" width="90" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="385" y="403" text-anchor="middle" font-size="12">IV+2</text>
  <line x1="430" y1="398" x2="486" y2="398" stroke="#333" marker-end="url(#arrow)"/>
  <text x="450" y="392" font-size="11" fill="#c62828">+1</text>
  <rect x="490" y="380" width="90" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="535" y="403" text-anchor="middle" font-size="12">IV+3</text>

  <!-- IV+1/IV+2/IV+3：下左下右，第一个“下”加长，enc 下挪 -->
  <polyline points="235,416 235,446 175,446 175,520 221,520" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="243" y="442" font-size="11" fill="#c62828">enc</text>

  <polyline points="385,416 385,446 325,446 325,520 371,520" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="393" y="442" font-size="11" fill="#c62828">enc</text>

  <polyline points="535,416 535,446 475,446 475,520 521,520" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="543" y="442" font-size="11" fill="#c62828">enc</text>

  <!-- 密文行（解密输入） -->
  <rect x="190" y="460" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="235" y="483" text-anchor="middle">密文 C1</text>
  <rect x="340" y="460" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="385" y="483" text-anchor="middle">密文 C2</text>
  <rect x="490" y="460" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="535" y="483" text-anchor="middle">密文 C3</text>

  <line x1="235" y1="496" x2="235" y2="506" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="385" y1="496" x2="385" y2="506" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="535" y1="496" x2="535" y2="506" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或 -->
  <circle cx="235" cy="520" r="14" fill="#fff" stroke="#333"/>
  <text x="235" y="525" text-anchor="middle" font-size="14">+</text>
  <circle cx="385" cy="520" r="14" fill="#fff" stroke="#333"/>
  <text x="385" y="525" text-anchor="middle" font-size="14">+</text>
  <circle cx="535" cy="520" r="14" fill="#fff" stroke="#333"/>
  <text x="535" y="525" text-anchor="middle" font-size="14">+</text>

  <line x1="235" y1="534" x2="235" y2="556" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="385" y1="534" x2="385" y2="556" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="535" y1="534" x2="535" y2="556" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 明文行 -->
  <rect x="190" y="560" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="235" y="583" text-anchor="middle">明文 P1</text>
  <rect x="340" y="560" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="385" y="583" text-anchor="middle">明文 P2</text>
  <rect x="490" y="560" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="535" y="583" text-anchor="middle">明文 P3</text>

  <!-- 认证校验分支：AAD + 密文 -> GHASH -> 直接比对 Tag -->
  <rect x="660" y="380" width="80" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="700" y="403" text-anchor="middle" font-size="12">AAD</text>
  <line x1="700" y1="416" x2="700" y2="446" stroke="#333" marker-end="url(#arrow)"/>
  <text x="708" y="438" font-size="11" fill="#c62828">auth</text>

  <rect x="660" y="450" width="80" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="700" y="473" text-anchor="middle" font-size="12">GHASH</text>

  <path d="M580,478 L620,478 L620,478 L656,478" fill="none" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="700" y1="486" x2="700" y2="556" stroke="#333" marker-end="url(#arrow)"/>
  <rect x="650" y="560" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="700" y="583" text-anchor="middle" font-size="12">比对 Tag</text>
</svg>