<svg xmlns="http://www.w3.org/2000/svg" width="780" height="720" viewBox="0 0 780 720" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="390" y="24" text-anchor="middle" font-size="16" font-weight="bold">OFB 加密与解密</text>

  <!-- ================= 加密部分 ================= -->
  <text x="30" y="50" font-size="13" fill="#555">加密</text>

  <!-- 第1行：KS1 / KS2 / KS3 -->
  <rect x="160" y="60" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="210" y="83" text-anchor="middle" font-size="12">KS1</text>
  <rect x="360" y="60" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="410" y="83" text-anchor="middle" font-size="12">KS2</text>
  <rect x="560" y="60" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="610" y="83" text-anchor="middle" font-size="12">KS3</text>

  <!-- IV -> enc -> KS1 -->
  <rect x="60" y="60" width="50" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="85" y="83" text-anchor="middle">IV</text>
  <line x1="110" y1="78" x2="150" y2="78" stroke="#333" marker-end="url(#arrow)"/>
  <text x="120" y="72" font-size="11" fill="#c62828">enc</text>

  <line x1="260" y1="78" x2="350" y2="78" stroke="#333" marker-end="url(#arrow)"/>
  <text x="280" y="72" font-size="11" fill="#c62828">enc</text>

  <line x1="460" y1="78" x2="550" y2="78" stroke="#333" marker-end="url(#arrow)"/>
  <text x="480" y="72" font-size="11" fill="#c62828">enc</text>

  <!-- KS 绕行到异或 -->
  <polyline points="210,96 210,116 140,116 140,250 196,250" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <polyline points="410,96 410,116 340,116 340,250 396,250" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <polyline points="610,96 610,116 540,116 540,250 596,250" fill="none" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 第2行：明文 -->
  <rect x="160" y="160" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="210" y="183" text-anchor="middle">明文 P1</text>
  <rect x="360" y="160" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="410" y="183" text-anchor="middle">明文 P2</text>
  <rect x="560" y="160" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="610" y="183" text-anchor="middle">明文 P3</text>

  <!-- 明文 -> 异或（终点在圆上方，箭头不被遮挡） -->
  <line x1="210" y1="196" x2="210" y2="232" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="410" y1="196" x2="410" y2="232" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="610" y1="196" x2="610" y2="232" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或符号 -->
  <circle cx="210" cy="250" r="14" fill="#fff" stroke="#333"/>
  <text x="210" y="255" text-anchor="middle" font-size="14">+</text>
  <circle cx="410" cy="250" r="14" fill="#fff" stroke="#333"/>
  <text x="410" y="255" text-anchor="middle" font-size="14">+</text>
  <circle cx="610" cy="250" r="14" fill="#fff" stroke="#333"/>
  <text x="610" y="255" text-anchor="middle" font-size="14">+</text>

  <!-- 异或 -> 密文：缩短箭头，密文框紧贴异或下方 -->
  <line x1="210" y1="264" x2="210" y2="286" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="410" y1="264" x2="410" y2="286" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="610" y1="264" x2="610" y2="286" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 第3行：密文（上移，紧贴异或） -->
  <rect x="160" y="290" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="210" y="313" text-anchor="middle">密文 C1</text>
  <rect x="360" y="290" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="410" y="313" text-anchor="middle">密文 C2</text>
  <rect x="560" y="290" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="610" y="313" text-anchor="middle">密文 C3</text>

  <line x1="20" y1="360" x2="760" y2="360" stroke="#ccc" stroke-dasharray="6,4"/>

  <!-- ================= 解密部分 ================= -->
  <text x="30" y="390" font-size="13" fill="#555">解密</text>

  <!-- 第1行：KS -->
  <rect x="160" y="400" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="210" y="423" text-anchor="middle" font-size="12">KS1</text>
  <rect x="360" y="400" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="410" y="423" text-anchor="middle" font-size="12">KS2</text>
  <rect x="560" y="400" width="100" height="36" rx="6" fill="#fff3e0" stroke="#333"/>
  <text x="610" y="423" text-anchor="middle" font-size="12">KS3</text>

  <rect x="60" y="400" width="50" height="36" rx="6" fill="#f3e5f5" stroke="#333"/>
  <text x="85" y="423" text-anchor="middle">IV</text>
  <line x1="110" y1="418" x2="150" y2="418" stroke="#333" marker-end="url(#arrow)"/>
  <text x="120" y="412" font-size="11" fill="#c62828">enc</text>

  <line x1="260" y1="418" x2="350" y2="418" stroke="#333" marker-end="url(#arrow)"/>
  <text x="280" y="412" font-size="11" fill="#c62828">enc</text>

  <line x1="460" y1="418" x2="550" y2="418" stroke="#333" marker-end="url(#arrow)"/>
  <text x="480" y="412" font-size="11" fill="#c62828">enc</text>

  <polyline points="210,436 210,456 140,456 140,590 196,590" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <polyline points="410,436 410,456 340,456 340,590 396,590" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <polyline points="610,436 610,456 540,456 540,590 596,590" fill="none" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 第2行：密文（解密输入） -->
  <rect x="160" y="500" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="210" y="523" text-anchor="middle">密文 C1</text>
  <rect x="360" y="500" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="410" y="523" text-anchor="middle">密文 C2</text>
  <rect x="560" y="500" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#333"/>
  <text x="610" y="523" text-anchor="middle">密文 C3</text>

  <line x1="210" y1="536" x2="210" y2="572" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="410" y1="536" x2="410" y2="572" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="610" y1="536" x2="610" y2="572" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 异或 -->
  <circle cx="210" cy="590" r="14" fill="#fff" stroke="#333"/>
  <text x="210" y="595" text-anchor="middle" font-size="14">+</text>
  <circle cx="410" cy="590" r="14" fill="#fff" stroke="#333"/>
  <text x="410" y="595" text-anchor="middle" font-size="14">+</text>
  <circle cx="610" cy="590" r="14" fill="#fff" stroke="#333"/>
  <text x="610" y="595" text-anchor="middle" font-size="14">+</text>

  <!-- 异或 -> 明文：缩短箭头 -->
  <line x1="210" y1="604" x2="210" y2="626" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="410" y1="604" x2="410" y2="626" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="610" y1="604" x2="610" y2="626" stroke="#333" marker-end="url(#arrow)"/>

  <!-- 第3行：明文（上移，紧贴异或） -->
  <rect x="160" y="630" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="210" y="653" text-anchor="middle">明文 P1</text>
  <rect x="360" y="630" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="410" y="653" text-anchor="middle">明文 P2</text>
  <rect x="560" y="630" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#333"/>
  <text x="610" y="653" text-anchor="middle">明文 P3</text>
</svg>